<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tes Otomatis · Monitoring ISP Sicepat</title>
  <style>
    body { font: 14px/1.5 system-ui, "Segoe UI", sans-serif; margin: 24px; background: #fff; color: #111; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    .note { color: #555; margin: 0 0 16px; }
    #summary { font-weight: 700; padding: 10px 14px; border-radius: 8px; background: #eef; margin-bottom: 14px; }
    #summary.pass { background: #dff5e3; color: #0b5d1e; }
    #summary.fail { background: #fde4e2; color: #8a1a10; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f6f6f6; padding: 12px; border-radius: 8px; }
  </style>

<body>
  <!--
    Halaman tes otomatis. Cara pakai: jalankan server lokal (Ctrl+Shift+B di VS Code) lalu buka
    http://localhost:5500/tests/  -- hasil tampil di halaman ini. Aman: semua key penyimpanan memakai
    namespace "unit" (?ns=unit), jadi data & akun asli aplikasi TIDAK tersentuh.
    Tes UI memuat ../index.html di dalam iframe tersembunyi dengan lebar layar berbeda-beda.
  -->
  <h1>Tes otomatis — Monitoring ISP Sicepat</h1>
  <p class="note">Memakai namespace penyimpanan <code>.unit</code>; data dan akun asli aplikasi tidak disentuh.</p>
  <div id="summary">Menjalankan tes…</div>
  <pre id="report"></pre>
  <div id="frames" style="position:absolute;left:-99999px;top:0"></div>

  <script>
    // Wajib ber-namespace: tanpa ?ns= tes dialihkan ke ?ns=unit agar tidak menimpa data asli.
    if (!/[?&]ns=/.test(window.location.search)) window.location.replace(window.location.pathname + '?ns=unit');
  </script>
  <script src="../js/config/config.js"></script>

  <script src="../js/core/store.js"></script>
  <script src="../js/core/validation.js"></script>
  <script src="../js/core/sample.js"></script>
  <script src="../js/core/csv.js"></script>
  <script src="../js/core/excel.js"></script>
  <script src="../js/core/net-store.js"></script>
  <script src="runner.js"></script>
  <script src="unit.js"></script>
  <script src="ui.js"></script>
  <script>T.run();</script>
